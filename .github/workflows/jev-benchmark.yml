name: Jev OFF vs ON benchmark

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: Number of frozen Jev cases to run (1-8)
        required: false
        default: '8'
      vision_provider:
        description: Vision provider for this benchmark (cloudflare/openrouter/gemini/groq)
        required: false
        default: 'cloudflare'

permissions:
  contents: read

concurrency:
  group: jev-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JEV_CASE_LIMIT: ${{ inputs.case_limit || '8' }}
      BENCHMARK_VISION_PROVIDER: ${{ inputs.vision_provider || 'cloudflare' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record commit
        run: git rev-parse HEAD | tee benchmark-commit.txt

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium-browser || sudo apt-get install --yes chromium

      - name: Prepare extension types
        run: pnpm --filter @vcl/extension exec wxt prepare

      - name: Verify
        run: |
          pnpm check
          pnpm build
          node --test apps/api/tests/jev-router.test.mjs

      - name: Prepare preview-only Wrangler config
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const input = readFileSync('apps/api/wrangler.jsonc', 'utf8');
          const output = input.replace(
            /"workers_dev"\s*:\s*true\s*,/,
            '"workers_dev": true,\n  "preview_urls": true,',
          );
          if (output === input) throw new Error('workers_dev=true not found in Wrangler config');
          const path = 'apps/api/.jev-wrangler.jsonc';
          writeFileSync(path, output);
          console.log(readFileSync(path, 'utf8'));
          NODE
          pnpm exec wrangler versions upload --help >/dev/null

      - name: Create OFF Worker version preview
        run: |
          pnpm exec wrangler versions upload \
            --config "apps/api/.jev-wrangler.jsonc" \
            --name vcl-api \
            --var JEV_DECISION_ROUTER:false \
            --var VISION_PROVIDER:"$BENCHMARK_VISION_PROVIDER" \
            --preview-alias jev-off \
            --tag jev-off-${GITHUB_SHA} \
            --message "Jev benchmark OFF ${GITHUB_SHA}" | tee jev-off-upload.log
          awk '/Version Preview Alias URL:/ { print $NF }' jev-off-upload.log > jev-off-origin.txt
          test -s jev-off-origin.txt

      - name: Create ON Worker version preview
        run: |
          pnpm exec wrangler versions upload \
            --config "apps/api/.jev-wrangler.jsonc" \
            --name vcl-api \
            --var JEV_DECISION_ROUTER:true \
            --var VISION_PROVIDER:"$BENCHMARK_VISION_PROVIDER" \
            --preview-alias jev-on \
            --tag jev-on-${GITHUB_SHA} \
            --message "Jev benchmark ON ${GITHUB_SHA}" | tee jev-on-upload.log
          awk '/Version Preview Alias URL:/ { print $NF }' jev-on-upload.log > jev-on-origin.txt
          test -s jev-on-origin.txt

      - name: Freeze valid benchmark cases
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const f = JSON.parse(readFileSync('tests/manual/spike-5/cases-v2.json', 'utf8'));
          const identities = {
            's5-01': { brand: 'Patagonia', model: 'Better Sweater' },
            's5-02': { brand: 'Patagonia', model: 'Better Sweater' },
            's5-03': { brand: 'Seiko', model: 'SKX007' },
            's5-04': { brand: 'Seiko', model: 'SKX007' },
            's5-05': { brand: 'Coach', model: null },
            's5-06': { brand: 'Coach', model: null },
            's5-07': { brand: 'Adidas', model: 'Samba OG' },
            's5-08': { brand: 'Adidas', model: 'Samba OG' },
          };
          f.cases = f.cases
            .filter((c) => c.valid !== false)
            .map((c) => ({ ...c, expected_identity: identities[c.id] ?? null }));
          if (f.cases.some((c) => !c.expected_identity)) throw new Error('Missing expected identity for a valid Jev benchmark case');
          writeFileSync(process.env.RUNNER_TEMP + '/jev-cases.json', JSON.stringify(f));
          NODE

      - name: Prepare shared vision inputs once
        run: |
          export VCL_COST_CASES="$RUNNER_TEMP/jev-cases.json"
          export VCL_COST_LIMIT="$JEV_CASE_LIMIT"
          export VCL_HEADLESS=1
          export VCL_FROZEN_FRAME_DIR="$GITHUB_WORKSPACE/tests/benchmark/jev/frames"
          export VCL_PREPARE_ONLY=1
          export VCL_PREPARED_OUTPUT="$GITHUB_WORKSPACE/jev-prepared.json"
          export VCL_CDP_PORT=9334
          export VCL_COST_PROFILE="$RUNNER_TEMP/jev-browser-prep"
          # Vision is shared by OFF and ON. Prepare against the ON preview so the
          # benchmark can safely test a provider without changing production.
          export VCL_API_ORIGIN="$(cat jev-on-origin.txt)"

          printf '{"schema_version":1,"rows":[]}' > "$VCL_PREPARED_OUTPUT"
          printf '{"attempts":[]}' > "$GITHUB_WORKSPACE/jev-vision-attempts.json"

          for case_index in $(seq 0 $((JEV_CASE_LIMIT - 1))); do
            case_ok=0
            case_output="$RUNNER_TEMP/jev-prepared-case-$case_index.json"

            for attempt in 1 2 3; do
              echo "Preparing vision case $((case_index + 1))/$JEV_CASE_LIMIT, attempt $attempt/3"
              rm -f "$case_output"
              attempt_output="$RUNNER_TEMP/jev-attempt-$case_index-$attempt.json"
              rm -f "$attempt_output"

              # A failed provider call can leave Chromium/CDP in a bad state.
              # Reset only the browser session; keep already prepared cases.
              pkill -f "remote-debugging-port=$VCL_CDP_PORT" 2>/dev/null || true
              rm -rf "$VCL_COST_PROFILE" || true
              mkdir -p "$VCL_COST_PROFILE"
              sleep 1

              set +e
              VCL_COST_OFFSET="$case_index" \
              VCL_COST_LIMIT=1 \
              VCL_PREPARED_OUTPUT="$case_output" \
              VCL_COST_OUTPUT="$attempt_output" \
              node tests/cost/run-live.mjs
              runner_status=$?
              set -e

              node --input-type=module - "$attempt_output" "$GITHUB_WORKSPACE/jev-vision-attempts.json" "$runner_status" "$case_index" "$attempt" <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const [attemptPath, aggregatePath, statusRaw, caseIndexRaw, attemptRaw] = process.argv.slice(2);
          const aggregate = JSON.parse(readFileSync(aggregatePath, 'utf8'));
          let detail = null;
          if (existsSync(attemptPath)) {
            try {
              const doc = JSON.parse(readFileSync(attemptPath, 'utf8'));
              detail = (doc.runs ?? doc.failed_runs ?? [])[0] ?? null;
            } catch {}
          }
          aggregate.attempts.push({
            case_index: Number(caseIndexRaw),
            attempt: Number(attemptRaw),
            runner_status: Number(statusRaw),
            case_id: detail?.case_id ?? null,
            failure_class: detail?.failure_class ?? null,
            vision_routing: detail?.vision_routing ?? null,
          });
          writeFileSync(aggregatePath, JSON.stringify(aggregate, null, 2) + '\n');
          NODE

              if [ "$runner_status" -eq 0 ] && node --input-type=module - "$case_output" "$VCL_PREPARED_OUTPUT" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const [casePath, combinedPath] = process.argv.slice(2);
          const one = JSON.parse(readFileSync(casePath, 'utf8'));
          if ((one.rows ?? []).length !== 1) process.exit(1);
          const combined = JSON.parse(readFileSync(combinedPath, 'utf8'));
          combined.rows.push(one.rows[0]);
          writeFileSync(combinedPath, JSON.stringify(combined, null, 2) + '\n');
          NODE
              then
                case_ok=1
                break
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "Vision case was provider-blocked; preserving completed cases and retrying after cooldown."
                sleep 20
              fi
            done

            if [ "$case_ok" -ne 1 ]; then
              echo "Shared vision preparation unavailable for case $((case_index + 1)); recording failure and continuing."
            fi
          done

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const prepared = JSON.parse(readFileSync(process.env.VCL_PREPARED_OUTPUT, 'utf8'));
          const requested = Number(process.env.JEV_CASE_LIMIT || 8);
          const preparedCount = (prepared.rows ?? []).length;
          if (preparedCount === 0) throw new Error('No vision inputs were prepared; Jev comparison cannot run.');
          writeFileSync('jev-prepared-count.txt', String(preparedCount) + '\n');
          console.log(`Prepared ${preparedCount}/${requested} vision inputs; continuing Jev comparison with available cases.`);
          NODE

      - name: Run identical OFF and ON commerce from shared vision
        run: |
          set +e
          printf '{"runs":[]}' > "$GITHUB_WORKSPACE/jev-off.json"
          printf '{"runs":[]}' > "$GITHUB_WORKSPACE/jev-on.json"

          prepared_count="$(cat jev-prepared-count.txt)"
          VCL_PREPARED_CASE_COUNT="$prepared_count" \
          VCL_PREPARED_INPUT="$GITHUB_WORKSPACE/jev-prepared.json" \
          VCL_API_ORIGIN="$(cat jev-off-origin.txt)" \
          VCL_COST_OUTPUT="$GITHUB_WORKSPACE/jev-off.json" \
          node tests/cost/run-prepared-commerce.mjs
          echo $? > jev-off-status.txt

          VCL_PREPARED_CASE_COUNT="$prepared_count" \
          VCL_PREPARED_INPUT="$GITHUB_WORKSPACE/jev-prepared.json" \
          VCL_API_ORIGIN="$(cat jev-on-origin.txt)" \
          VCL_COST_OUTPUT="$GITHUB_WORKSPACE/jev-on.json" \
          node tests/cost/run-prepared-commerce.mjs
          echo $? > jev-on-status.txt

      - name: Produce OFF vs ON report
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const load = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const off = load('jev-off.json');
          const on = load('jev-on.json');
          const prepared = load('jev-prepared.json');
          const visionAttempts = load('jev-vision-attempts.json');
          const percentile = (values, p) => { const v = values.filter(Number.isFinite).sort((a,b)=>a-b); return v.length ? v[Math.min(v.length-1, Math.ceil(v.length*p)-1)] : null; };
          const metric = (doc, includeJev) => {
            const rows = doc.runs ?? [];
            const latencies = rows.map(r => r.latency_ms);
            const useful = rows.filter(r => r.notes?.includes('state=RESULTS')).length;
            const commerce = rows.reduce((n,r) => n + Object.values(r.commerce_calls ?? {}).reduce((a,b)=>a+Number(b||0),0),0);
            const verification = rows.reduce((n,r) => n + Number(r.verification_usage?.requests ?? 0),0);
            const usageCost = (usage) => Number.isFinite(Number(usage?.cost_usd)) ? Number(usage.cost_usd) : 0;
            const totalAiCost = rows.reduce((n,r) => n + usageCost(r.localization_usage) + usageCost(r.vision_usage) + usageCost(r.verification_usage), 0);
            const falseExactValues = rows.map(r => r.false_exact).filter(v => Number.isFinite(v));
            const unsupportedLikelyValues = rows.map(r => r.unsupported_likely).filter(v => Number.isFinite(v));
            const falseExact = falseExactValues.length === rows.length ? falseExactValues.reduce((a,b)=>a+b,0) : null;
            const unsupportedLikely = unsupportedLikelyValues.length === rows.length ? unsupportedLikelyValues.reduce((a,b)=>a+b,0) : null;
            const out = {
              successful_cases: rows.length,
              useful_rate: rows.length ? useful/rows.length : null,
              p50_latency_ms: percentile(latencies,.5),
              p95_latency_ms: percentile(latencies,.95),
              verification_calls: verification,
              commerce_calls: commerce,
              total_ai_cost_usd: totalAiCost,
              cost_per_scoop_usd: rows.length ? totalAiCost / rows.length : null,
              cost_per_useful_scoop_usd: useful ? totalAiCost / useful : null,
              false_exact: falseExact,
              unsupported_likely: unsupportedLikely,
            };
            if (includeJev) {
              out.jev_route_choices = {};
              out.jev_latency_ms = [];
              out.jev_failures = 0;
              out.jev_failure_kinds = {};
              out.jev_failure_diagnostics = [];
              for (const r of rows) {
                const j=r.jev_router;
                if (!j) continue;
                const k=`${j.commerce_action}/${j.verification_action}/${j.multiframe_action}`;
                out.jev_route_choices[k]=(out.jev_route_choices[k]??0)+1;
                out.jev_latency_ms.push(j.latency_ms);
                if (j.failed) {
                  out.jev_failures++;
                  const kind=j.failure_kind ?? 'unknown';
                  out.jev_failure_kinds[kind]=(out.jev_failure_kinds[kind]??0)+1;
                  out.jev_failure_diagnostics.push({
                    case_id:r.case_id,
                    kind,
                    message:j.failure_message ?? null,
                    http_status:j.http_status ?? null,
                    error_code:j.error_code ?? null,
                    response_shape:j.response_shape ?? null,
                    latency_ms:j.latency_ms ?? null,
                    model:j.model ?? null,
                    request_schema_version:j.request_schema_version ?? null,
                  });
                }
              }
              out.jev_p50_latency_ms=percentile(out.jev_latency_ms,.5);
              out.jev_p95_latency_ms=percentile(out.jev_latency_ms,.95);
            }
            return out;
          };
          const visionRoutes = (prepared.rows ?? []).flatMap(r => [r.localization_routing, r.vision_routing].filter(Array.isArray));
          const failedAttemptRoutes = (visionAttempts.attempts ?? []).map(a => a.vision_routing).filter(Array.isArray);
          const allRouteEntries = [...visionRoutes, ...failedAttemptRoutes].flat();
          const successfulRoute = (route) => route.find(e => e?.status === 'SUCCESS') ?? null;
          const fallbackOperations = visionRoutes.filter(route => {
            const success = successfulRoute(route);
            if (!success) return false;
            const firstAttempted = route.find(e => e?.status !== 'SKIPPED');
            return firstAttempted && success.provider !== firstAttempted.provider;
          }).length;
          const scoutRetryRecovered = visionRoutes.filter(route =>
            route.some(e => e?.provider === 'cloudflare' && e?.status === 'FAILED' && e?.reason === 'PROVIDER_ERROR') &&
            route.some(e => e?.provider === 'cloudflare' && e?.status === 'SUCCESS')
          ).length;
          const expectedVisionCases = Number(process.env.JEV_CASE_LIMIT || 8);
          const firstAttempts = (visionAttempts.attempts ?? []).filter(a => a.attempt === 1);
          const retriedCaseIndexes = new Set((visionAttempts.attempts ?? []).filter(a => a.attempt > 1).map(a => a.case_index));
          const visionReliability = {
            vision_success_rate: expectedVisionCases ? firstAttempts.filter(a => a.runner_status === 0).length / expectedVisionCases : null,
            first_attempt_successes: firstAttempts.filter(a => a.runner_status === 0).length,
            cases_retried: retriedCaseIndexes.size,
            retry_rate: expectedVisionCases ? retriedCaseIndexes.size / expectedVisionCases : null,
            provider_errors: allRouteEntries.filter(e => e?.reason === 'PROVIDER_ERROR').length,
            provider_timeouts: allRouteEntries.filter(e => e?.reason === 'PROVIDER_TIMEOUT').length,
            fallback_operations: fallbackOperations,
            fallback_rate: visionRoutes.length ? fallbackOperations / visionRoutes.length : null,
            scout_retry_recovered: scoutRetryRecovered,
            measured_operations: visionRoutes.length,
          };
          const O=metric(off,false), N=metric(on,true);
          const delta=(a,b)=>a==null||b==null?null:b-a;
          const pct=(a,b)=>a==null||b==null||a===0?null:(b-a)/a*100;
          const runStatus={off:Number(readFileSync('jev-off-status.txt','utf8')),on:Number(readFileSync('jev-on-status.txt','utf8'))};
          const requested=Number(process.env.JEV_CASE_LIMIT || 8);
          const expected=(prepared.rows ?? []).length;
          const visionComplete=expected===requested;
          const complete=runStatus.off===0&&runStatus.on===0&&O.successful_cases===expected&&N.successful_cases===expected;
          const report={commit:readFileSync('benchmark-commit.txt','utf8').trim(),case_limit:requested,prepared_case_count:expected,vision_complete:visionComplete,vision_reliability:visionReliability,off:O,on:N,run_status:runStatus,sample_complete:complete,delta:{useful_rate:delta(O.useful_rate,N.useful_rate),p50_latency_pct:pct(O.p50_latency_ms,N.p50_latency_ms),p95_latency_pct:pct(O.p95_latency_ms,N.p95_latency_ms),verification_calls_pct:pct(O.verification_calls,N.verification_calls),commerce_calls_pct:pct(O.commerce_calls,N.commerce_calls)},trust_gates:{false_exact:O.false_exact===0&&N.false_exact===0,unsupported_likely:O.unsupported_likely===0&&N.unsupported_likely===0,measured:complete&&Number.isFinite(O.false_exact)&&Number.isFinite(N.false_exact)&&Number.isFinite(O.unsupported_likely)&&Number.isFinite(N.unsupported_likely)}};
          writeFileSync('jev-report.json',JSON.stringify(report,null,2)+'\n');
          writeFileSync('jev-report.md', '# Jev OFF vs ON\\n\\nCommit: ' + report.commit + '\\n\\n## VISION RELIABILITY\\n\\n' + JSON.stringify(visionReliability,null,2) + '\\n\\n## OFF\\n\\n' + JSON.stringify(O,null,2) + '\\n\\n## ON\\n\\n' + JSON.stringify(N,null,2) + '\\n\\n## DELTA\\n\\n' + JSON.stringify(report.delta,null,2) + '\\n\\nTrust gates: false EXACT=' + (report.trust_gates.false_exact ? 0 : 'FAIL') + ', unsupported LIKELY=' + (report.trust_gates.unsupported_likely ? 0 : 'FAIL') + '\\n');
          console.log(JSON.stringify(report,null,2));
          if (!report.trust_gates.measured || !report.trust_gates.false_exact || !report.trust_gates.unsupported_likely) process.exitCode=1;
          NODE

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-benchmark-${{ github.run_id }}
          path: |
            benchmark-commit.txt
            jev-*-upload.log
            jev-*-origin.txt
            jev-prepared.json
            jev-prepared-count.txt
            jev-vision-attempts.json
            jev-off.json
            jev-on.json
            jev-*-status.txt
            jev-report.json
            jev-report.md
