name: Jev vs Clef-Flash router benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions per frozen router case
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: clef-router-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      REPS: ${{ inputs.repetitions || '3' }}

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify experiment
        run: |
          pnpm --filter @vcl/api check
          pnpm --filter @vcl/api build
          node --test apps/api/tests/jev-router.test.mjs

      - name: Prepare isolated router preview configs
        run: |
          cat > apps/api/.clef-router-only-wrangler.jsonc <<'EOF'
          {
            "name": "vcl-api",
            "main": "src/clef-benchmark-worker.ts",
            "compatibility_date": "2026-09-11",
            "previews": {
              "vars": { "JEV_ROUTER_MODEL": "clef-flash" },
              "ai": { "binding": "AI" }
            }
          }
          EOF

      - name: Create Clef-Flash preview
        run: |
          set -euo pipefail
          output="$(pnpm dlx wrangler@4.135.0 preview --config apps/api/.clef-router-only-wrangler.jsonc --worker-name vcl-api --name "clef-flash-$GITHUB_RUN_ID" --json)"
          printf '%s\n' "$output" | tee clef-preview-upload.log
          printf '%s' "$output" | jq -er '.preview_urls[0] // .preview.urls[0]' > clef-origin.txt

      - name: Run frozen router benchmark
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const cases = JSON.parse(readFileSync('tests/benchmark/clef/router-cases.json','utf8')).cases;
          const reps = Number(process.env.REPS || 3);
          const origin = readFileSync('clef-origin.txt','utf8').trim();
          if (!process.env.AI_GATEWAY_API_KEY) throw new Error('Missing GitHub Actions secret: AI_GATEWAY_API_KEY');

          const rows = [];
          for (const c of cases) {
            for (const provider of ['jev','clef']) {
              for (let i = 0; i < reps; i++) {
                const started = Date.now();
                let status = 0;
                let body = null;
                let error = null;
                try {
                  const res = await fetch(origin, {
                    method: 'POST',
                    headers: {
                      'content-type':'application/json',
                      ...(provider === 'jev' ? { 'x-benchmark-vercel-key': process.env.AI_GATEWAY_API_KEY } : {}),
                    },
                    body: JSON.stringify(c.input),
                  });
                  status = res.status;
                  body = await res.json().catch(() => null);
                } catch (e) {
                  error = String(e);
                }
                rows.push({
                  case_id: c.id,
                  provider,
                  repetition: i + 1,
                  wall_latency_ms: Date.now() - started,
                  status,
                  decision: body?.decision ?? null,
                  telemetry: body?.telemetry ?? null,
                  error,
                });
              }
            }
          }

          const pct=(values,p)=>{
            const v=values.filter(Number.isFinite).sort((a,b)=>a-b);
            return v.length ? v[Math.min(v.length-1,Math.ceil(v.length*p)-1)] : null;
          };
          const summarize=(provider)=>{
            const r=rows.filter(x=>x.provider===provider);
            const ok=r.filter(x=>x.status===200 && x.telemetry && !x.telemetry.failed);
            const modelLat=ok.map(x=>Number(x.telemetry.latency_ms));
            const wall=ok.map(x=>Number(x.wall_latency_ms));
            return {
              attempts:r.length,
              successes:ok.length,
              failures:r.length-ok.length,
              success_rate:r.length?ok.length/r.length:null,
              model:r.find(x=>x.telemetry?.model)?.telemetry?.model ?? null,
              p50_router_latency_ms:pct(modelLat,.5),
              p95_router_latency_ms:pct(modelLat,.95),
              p50_wall_latency_ms:pct(wall,.5),
              p95_wall_latency_ms:pct(wall,.95),
            };
          };
          const jev=summarize('jev');
          const clef=summarize('clef');

          const disagreements=[];
          for (const c of cases) {
            const j=rows.find(x=>x.case_id===c.id && x.provider==='jev' && x.status===200)?.decision;
            const f=rows.find(x=>x.case_id===c.id && x.provider==='clef' && x.status===200)?.decision;
            if (j && f && JSON.stringify(j)!==JSON.stringify(f)) disagreements.push({case_id:c.id,jev:j,clef:f});
          }

          const report={
            commit:process.env.GITHUB_SHA,
            repetitions:reps,
            cases:cases.length,
            jev,
            clef,
            delta:{
              p50_router_latency_pct:jev.p50_router_latency_ms && clef.p50_router_latency_ms
                ? (clef.p50_router_latency_ms-jev.p50_router_latency_ms)/jev.p50_router_latency_ms*100 : null,
              p95_router_latency_pct:jev.p95_router_latency_ms && clef.p95_router_latency_ms
                ? (clef.p95_router_latency_ms-jev.p95_router_latency_ms)/jev.p95_router_latency_ms*100 : null,
            },
            decision_disagreements:disagreements,
            pass: clef.failures===0,
          };
          writeFileSync('clef-router-rows.json',JSON.stringify(rows,null,2)+'\n');
          writeFileSync('clef-router-report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if (!report.pass) process.exitCode=1;
          NODE

      - name: Delete isolated previews
        if: always()
        continue-on-error: true
        run: |
          pnpm dlx wrangler@4.135.0 preview delete --worker-name vcl-api --name "clef-flash-$GITHUB_RUN_ID" --skip-confirmation || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clef-router-benchmark-${{ github.run_id }}
          path: |
            clef-origin.txt
            clef-preview-upload.log
            clef-router-rows.json
            clef-router-report.json
