name: roster-import-once

# One-time operational import of the partner roster into production.
#
# Runs this throwaway branch under `wrangler dev --remote` (real bindings, real
# secrets, no traffic change), imports through the same preparePartnerRoster +
# ingestPartnerRoster path the admin endpoint uses, then verifies the roster is
# visible at several timestamps. The branch is deleted after the run.

on:
  push:
    paths:
      - '.github/workflows/roster-import-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PARTNER_ROSTER_LIST: ${{ secrets.PARTNER_ROSTER_LIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/roster-import
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vcl/api build
      - name: Intake the partner list
        run: |
          set -euo pipefail
          printf '%s' "$PARTNER_ROSTER_LIST" > "$RUNNER_TEMP/list.md"
          node tools/roster-intake.mjs "$RUNNER_TEMP/list.md" --local --out "$RUNNER_TEMP/intake"
          node -e "const r=require(process.env.RUNNER_TEMP+'/intake/report.json');console.log(JSON.stringify({variants:r.items.length,ready:r.items.filter(i=>i.status==='READY').length,offers:r.offers}))"
      - name: Start the worker and import
        env:
          OPS_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd apps/api
          pnpm exec wrangler dev --remote --port 8787 --ip 127.0.0.1 --var OPS_RUN_ID:"$OPS_RUN" > "$RUNNER_TEMP/dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dev.pid"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 5; done
          curl -fsS http://127.0.0.1:8787/health || { tail -40 "$RUNNER_TEMP/dev.log"; exit 1; }
          node - "$RUNNER_TEMP/intake/manifest.json" "$OPS_RUN" <<'JS'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          (async () => {
            const res = await fetch('http://127.0.0.1:8787/ops/import-roster', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-ops-run': process.argv[3] },
              body: JSON.stringify(manifest),
            });
            console.log('import_status', res.status, await res.text());
          })();
          JS
      - name: Verify the roster is visible at several timestamps
        run: |
          set -uo pipefail
          node - <<'JS'
          const base='http://127.0.0.1:8787';
          const cropUrl='https://di2ponv0v5otw.cloudfront.net/posts/2026/10/09/6ac9b3b1ebb1a50f2b94b217/m_6ac9b4024fcf26fa59fcf316.jpg';
          const img=await fetch(cropUrl);
          const dataUrl=`data:${img.headers.get('content-type')?.split(';')[0]??'image/jpeg'};base64,${Buffer.from(await img.arrayBuffer()).toString('base64')}`;
          const out=[];
          for (const ts of [60000, 150000, 250000, 300000, 400000, 500000, 673000, 800000]) {
            const install=crypto.randomUUID();
            const post=async(p,b)=>{const r=await fetch(base+p,{method:'POST',headers:{'content-type':'application/json','x-scoop-install-id':install},body:JSON.stringify(b)});return await r.json().catch(()=>({}))};
            await post('/analyze-selection',{dataUrl,timestamp:ts,context:{platform:'youtube',content_ref:'n9u8ynhBdSo',timestamp_ms:ts}});
            const r=await post('/resolve-products',{description:{category:'accessories',subcategory:'bag',brand_candidate:'Louis Vuitton',color:'brown',material:'canvas',visible_text:[],logos_markings:[],distinctive_features:[],shape_silhouette:[],style_attributes:[],hardware_details:[],search_terms:[],confidence:.9,identity_confidence:0},source_image:dataUrl,context:{platform:'youtube',content_ref:'n9u8ynhBdSo',timestamp_ms:ts}});
            const ret=(r.verified_mapping||{}).roster_retrieval||{};
            out.push({ts, roster_count: ret.roster_count ?? null, retrieved:(ret.retrieved_keys||[]).length, products:(r.products||[]).length});
          }
          console.log('VERIFY ' + JSON.stringify(out));
          JS
      - name: Stop
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/dev.pid")" 2>/dev/null || true; pkill -f workerd 2>/dev/null || true
