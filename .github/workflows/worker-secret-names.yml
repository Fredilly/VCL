name: worker-secret-names

# Read-only inventory of a Worker's secret NAMES.
#
# The Cloudflare API never returns secret values, and this job prints names and
# types only, so nothing sensitive reaches a log. It answers one question: is the
# credential a fix depends on actually configured in production?

on:
  push:
    paths:
      - '.github/workflows/worker-secret-names.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: List secret names on vcl-api
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vcl-api/secrets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "http_status=${code}"
          if [ "$code" != "200" ]; then
            printf '%s' "$body" | head -c 400; echo; exit 1
          fi
          printf '%s' "$body" | node -e '
            let raw = "";
            process.stdin.on("data", (d) => (raw += d));
            process.stdin.on("end", () => {
              const parsed = JSON.parse(raw);
              const names = (parsed.result ?? []).map((s) => s.name).sort();
              const interesting = names.filter((n) => /GEMINI|GOOGLE|OPENROUTER|BRAVE|SERP|GROQ|GATEWAY/i.test(n));
              console.log(JSON.stringify({ secret_count: names.length, provider_secrets: interesting }, null, 1));
            });
          '
