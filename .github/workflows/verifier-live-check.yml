name: verifier-live-check

# One isolated live verification of the verifier fallback: this branch's code runs
# under `wrangler dev --remote`, so it talks to the real Worker bindings and the
# real secrets, while production traffic keeps serving the deployed version.
#
# One resolve request is made — the same thing a single user click does. Counts and
# reason names only; no secret values, no product titles.

on:
  push:
    paths:
      - '.github/workflows/verifier-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/verifier-fallback

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start this branch against the real bindings
        run: |
          set -euo pipefail
          cd apps/api
          pnpm exec wrangler dev --remote --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dev.pid"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/health > /dev/null 2>&1 && { echo "healthy after ${i}"; break; }
            sleep 5
          done
          curl -fsS http://127.0.0.1:8787/health || { tail -40 "$RUNNER_TEMP/dev.log"; exit 1; }

      - name: One resolve click
        run: |
          set -uo pipefail
          node - <<'JS'
          const base = 'http://127.0.0.1:8787';
          const cropUrl = 'https://di2ponv0v5otw.cloudfront.net/posts/2026/10/09/6ac9b3b1ebb1a50f2b94b217/m_6ac9b4024fcf26fa59fcf316.jpg';
          const post = async (path, body) => {
            const r = await fetch(`${base}${path}`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-scoop-install-id': 'verifier-live-check' }, body: JSON.stringify(body) });
            return { status: r.status, body: await r.json().catch(() => ({})) };
          };
          let dataUrl = null;
          try {
            const img = await fetch(cropUrl, { signal: AbortSignal.timeout(15000) });
            if (img.ok) dataUrl = `data:${img.headers.get('content-type')?.split(';')[0] ?? 'image/jpeg'};base64,${Buffer.from(await img.arrayBuffer()).toString('base64')}`;
            else console.log('crop_fetch_status', img.status);
          } catch (e) { console.log('crop_fetch_failed', e.message); }
          if (!dataUrl) { console.log(JSON.stringify({ result: 'no crop reachable from CI' })); process.exit(0); }
          // Three samples: one refusal can be a burst, three in a row is the config.
          for (let i = 1; i <= 3; i++) {
            const probe = await post('/analyze-selection', { dataUrl, timestamp: 0, context: { platform: 'youtube', content_ref: 'n9u8ynhBdSo', timestamp_ms: 0 } });
            console.log(JSON.stringify({ sample: i, status: probe.status, routing: probe.body.vision_routing ?? null }));
            await new Promise((r) => setTimeout(r, 1500));
          }
          const analysed = await post('/analyze-selection', { dataUrl, timestamp: 0, context: { platform: 'youtube', content_ref: 'n9u8ynhBdSo', timestamp_ms: 0 } });
          console.log(JSON.stringify({ analyze: { status: analysed.status, keys: Object.keys(analysed.body).slice(0, 14), error: analysed.body.error ?? null, routing: analysed.body.vision_routing ?? null } }));
          if (analysed.status !== 200) { process.exit(0); }
          const description = analysed.body.description ?? (analysed.body.category ? analysed.body : null);
          const resolved = await post('/resolve-products', { description, source_image: dataUrl, context: { platform: 'youtube', content_ref: 'n9u8ynhBdSo', timestamp_ms: 0 } });
          console.log(JSON.stringify({ resolve_error: resolved.status === 200 ? null : (resolved.body.error ?? resolved.body.reason ?? null), bytes: dataUrl.length }));
          const vm = resolved.body.verified_mapping ?? {};
          console.log(JSON.stringify({
            status: resolved.status,
            products: (resolved.body.products ?? []).length,
            classes: (resolved.body.products ?? []).map((p) => p.result_class),
            compared: resolved.body.verification?.compared ?? vm.candidates_compared ?? null,
            failure_reasons: resolved.body.verification?.image_failure_reasons ?? vm.visual_failure_reasons ?? null,
            analyze_routing: analysed.body.vision_routing ?? null,
            merchant: (() => { try { return new URL((resolved.body.products ?? [])[0]?.destination ?? '').host; } catch { return null; } })(),
          }, null, 1));
          JS

      - name: Stop the worker
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/dev.pid")" 2>/dev/null || true; pkill -f workerd 2>/dev/null || true
