name: verifier-live-check

# One isolated live verification of the verifier fallback, running this branch's
# code on Cloudflare with the Worker's own bindings and secrets.
#
# It uploads a VERSION (production traffic keeps serving the deployed one), finds
# that version's preview URL through the API, makes one resolve request, and then
# deletes the version it created. Counts and reason names only; no secret values.

on:
  push:
    paths:
      - '.github/workflows/verifier-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/verifier-fallback

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload a version of this branch (no traffic)
        run: |
          set -euo pipefail
          cd apps/api
          pnpm exec wrangler versions upload 2>&1 | tail -20

      - name: Find its preview URL and pin the version
        id: preview
        run: |
          set -euo pipefail
          sleep 5
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vcl-api/versions" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > "$RUNNER_TEMP/versions.json"
          node - "$RUNNER_TEMP/versions.json" <<'JS' >> "$GITHUB_OUTPUT"
          const data = JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8'));
          const items = (data.result?.items ?? []).slice().sort((a, b) => (b.number ?? 0) - (a.number ?? 0));
          const newest = items[0];
          if (!newest) { console.log('missing=true'); process.exit(0); }
          console.log(`id=${newest.id}`);
          console.log(`url=${newest.preview_url ?? ''}`);
          console.log(`created=${newest.created_on}`);
          JS
          cat "$GITHUB_OUTPUT" | tail -3

      - name: One resolve click against the preview
        if: steps.preview.outputs.url != ''
        run: |
          set -uo pipefail
          node - "${{ steps.preview.outputs.url }}" <<'JS'
          const base = process.argv[2].replace(/\/$/, '');
          const cropUrl = 'https://di2ponv0v5otw.cloudfront.net/posts/2026/10/09/6ac9b3b1ebb1a50f2b94b217/m_6ac9b4024fcf26fa59fcf316.jpg';
          const post = async (path, body) => {
            const r = await fetch(`${base}${path}`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-scoop-install-id': 'verifier-live-check' }, body: JSON.stringify(body) });
            return { status: r.status, body: await r.json().catch(() => ({})) };
          };
          let dataUrl = null;
          try {
            const img = await fetch(cropUrl, { signal: AbortSignal.timeout(15000) });
            if (img.ok) dataUrl = `data:${img.headers.get('content-type')?.split(';')[0] ?? 'image/jpeg'};base64,${Buffer.from(await img.arrayBuffer()).toString('base64')}`;
            else console.log('crop_fetch_status', img.status);
          } catch (e) { console.log('crop_fetch_failed', e.message); }
          if (!dataUrl) { console.log(JSON.stringify({ result: 'no crop reachable from CI' })); process.exit(0); }
          const analysed = await post('/analyze-selection', { dataUrl, timestamp: 0, context: { platform: 'youtube', content_ref: 'n9u8ynhBdSo', timestamp_ms: 0 } });
          if (analysed.status !== 200) { console.log(JSON.stringify({ stage: 'analyze', status: analysed.status, reason: analysed.body.reason, routing: analysed.body.vision_routing })); process.exit(0); }
          const description = analysed.body.description ?? (analysed.body.category ? analysed.body : null);
          const resolved = await post('/resolve-products', { description, source_image: dataUrl, context: { platform: 'youtube', content_ref: 'n9u8ynhBdSo', timestamp_ms: 0 } });
          const vm = resolved.body.verified_mapping ?? {};
          console.log(JSON.stringify({
            status: resolved.status,
            products: (resolved.body.products ?? []).length,
            classes: (resolved.body.products ?? []).map((p) => p.result_class),
            compared: resolved.body.verification?.compared ?? vm.candidates_compared ?? null,
            failure_reasons: resolved.body.verification?.image_failure_reasons ?? vm.visual_failure_reasons ?? null,
            analyze_routing: analysed.body.vision_routing ?? null,
            merchant: (() => { try { return new URL((resolved.body.products ?? [])[0]?.destination ?? '').host; } catch { return null; } })(),
          }, null, 1));
          JS

      - name: Delete the version this job created
        if: always() && steps.preview.outputs.id != ''
        run: |
          set -uo pipefail
          curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vcl-api/versions/${{ steps.preview.outputs.id }}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /dev/null -w 'delete_version_http=%{http_code}\n' || true
