name: secret-inventory

# Read-only: list Worker secret NAMES (values are never returned by the API).

on:
  push:
    paths:
      - '.github/workflows/secret-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Effective plain-text vars
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vcl-api/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s);const b=(p.result??{}).bindings??[];console.log(JSON.stringify(b.filter(x=>x.type==="plain_text").map(x=>x.name+"="+x.text).sort(),null,1))})'

      - name: Names only
        run: |
          set -euo pipefail
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vcl-api/secrets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s);console.log(JSON.stringify((p.result??[]).map(x=>x.name).sort(),null,1))})'
