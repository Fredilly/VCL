name: Clef Vision vs Gemini benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/clef-vision-benchmark.yml'
      - 'tests/benchmark/clef-vision/**'
      - 'apps/api/src/clef-vision-benchmark-worker.ts'
  workflow_dispatch:
    inputs:
      case_limit:
        description: Number of frozen cases to run (1-8)
        required: false
        default: '8'
      clef_model:
        description: Clef model (clef or clef-flash)
        required: false
        default: 'clef'
      benchmark_ref:
        description: Experimental ref to benchmark
        required: false
        default: 'experiment/clef-vision-vs-gemini'

permissions:
  contents: read

concurrency:
  group: clef-vision-vs-gemini
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CASE_LIMIT: ${{ inputs.case_limit || '8' }}
      CLEF_MODEL: ${{ inputs.clef_model || 'clef' }}
      BENCHMARK_REF: ${{ inputs.benchmark_ref || 'experiment/clef-vision-vs-gemini' }}

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BENCHMARK_REF }}

      - name: Record commit
        run: git rev-parse HEAD | tee clef-benchmark-commit.txt

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium-browser || sudo apt-get install --yes chromium

      - name: Prepare extension types and verify
        run: |
          pnpm --filter @vcl/extension exec wxt prepare
          pnpm check
          pnpm build

      - name: Create isolated Clef Workers AI preview
        run: |
          cat > "clef-benchmark-wrangler.jsonc" <<'JSON'
          {
            "$schema": "../../node_modules/wrangler/config-schema.json",
            "name": "vcl-clef-benchmark",
            "main": "apps/api/src/clef-vision-benchmark-worker.ts",
            "compatibility_date": "2026-09-11",
            "workers_dev": true,
            "ai": { "binding": "AI" },
            "previews": {
              "ai": { "binding": "AI" }
            }
          }
          JSON
          set -euo pipefail
          output="$(pnpm dlx wrangler@4.135.0 preview --config "clef-benchmark-wrangler.jsonc" --worker-name vcl-api --name "clef-vision-$GITHUB_RUN_ID" --json)"
          printf '%s\n' "$output" | tee clef-preview.log
          printf '%s' "$output" | jq -er '.preview_urls[0] // .preview.urls[0]' > clef-origin.txt

      - name: Freeze valid benchmark cases
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const f = JSON.parse(readFileSync('tests/manual/spike-5/cases-v2.json', 'utf8'));
          const identities = {
            's5-01': { brand: 'Patagonia', model: 'Better Sweater' },
            's5-02': { brand: 'Patagonia', model: 'Better Sweater' },
            's5-03': { brand: 'Seiko', model: 'SKX007' },
            's5-04': { brand: 'Seiko', model: 'SKX007' },
            's5-05': { brand: 'Coach', model: null },
            's5-06': { brand: 'Coach', model: null },
            's5-07': { brand: 'Adidas', model: 'Samba OG' },
            's5-08': { brand: 'Adidas', model: 'Samba OG' }
          };
          f.cases = f.cases
            .filter((c) => c.valid !== false)
            .slice(0, Number(process.env.CASE_LIMIT || 8))
            .map((c) => ({ ...c, expected_identity: identities[c.id] }));
          writeFileSync(process.env.RUNNER_TEMP + '/clef-cases.json', JSON.stringify(f));
          NODE

      - name: Prepare identical localized crops with current Gemini pipeline
        run: |
          export VCL_COST_CASES="$RUNNER_TEMP/clef-cases.json"
          export VCL_COST_LIMIT="$CASE_LIMIT"
          export VCL_HEADLESS=1
          export VCL_FROZEN_FRAME_DIR="$GITHUB_WORKSPACE/tests/benchmark/jev/frames"
          export VCL_PREPARE_ONLY=1
          export VCL_PREPARED_OUTPUT="$GITHUB_WORKSPACE/clef-gemini-prepared.json"
          export VCL_CDP_PORT=9334
          export VCL_COST_PROFILE="$RUNNER_TEMP/clef-browser"
          export VCL_API_ORIGIN="https://api.vcl.article6.org"
          node tests/cost/run-live.mjs

      - name: Run Clef on the exact same localized crops
        run: |
          VCL_CLEF_PREPARED_INPUT="$GITHUB_WORKSPACE/clef-gemini-prepared.json" \
          VCL_CLEF_OUTPUT="$GITHUB_WORKSPACE/clef-vision-report.json" \
          CLEF_MODEL="$CLEF_MODEL" \
          CLEF_ORIGIN="$(cat clef-origin.txt)" \
          node tests/benchmark/clef-vision/run.mjs

      - name: Print benchmark summary and enforce real Clef execution
        run: |
          jq '.summary' clef-vision-report.json
          failed="$(jq -r '.summary.clef.failed_cases' clef-vision-report.json)"
          if [ "$failed" != "0" ]; then
            echo "Clef failed $failed benchmark cases. This run is invalid."
            jq -r '.rows[] | select(.clef.error) | "\(.case_id): \(.clef.error)"' clef-vision-report.json
            exit 1
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clef-vision-vs-gemini-${{ github.run_id }}
          path: |
            clef-benchmark-commit.txt
            clef-preview.log
            clef-gemini-prepared.json
            clef-vision-report.json
