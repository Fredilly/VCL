name: creator-sku-check

# Temporary: one click at a timestamp where the Worker reports 26 roster rows, to
# see whether a creator SKU can be surfaced. Removed before the PR is opened.

on:
  push:
    paths:
      - '.github/workflows/creator-sku-check.yml'
      - 'apps/api/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  click:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/creator-sku-link
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start against real bindings
        run: |
          set -euo pipefail
          cd apps/api
          pnpm exec wrangler dev --remote --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dev.pid"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break; sleep 5; done
          curl -fsS http://127.0.0.1:8787/health || { tail -40 "$RUNNER_TEMP/dev.log"; exit 1; }
      - name: Two clicks (seeded-window and plain)
        run: |
          set -uo pipefail
          node - <<'JS'
          const base='http://127.0.0.1:8787';
          const cropUrl='https://di2ponv0v5otw.cloudfront.net/posts/2026/10/09/6ac9b3b1ebb1a50f2b94b217/m_6ac9b4024fcf26fa59fcf316.jpg';
          const img=await fetch(cropUrl);
          const dataUrl=`data:${img.headers.get('content-type')?.split(';')[0]??'image/jpeg'};base64,${Buffer.from(await img.arrayBuffer()).toString('base64')}`;
          for (const ts of [249744, 60000]) {
            const install=crypto.randomUUID();
            const post=async(p,b)=>{const r=await fetch(base+p,{method:'POST',headers:{'content-type':'application/json','x-scoop-install-id':install},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}};
            const a=await post('/analyze-selection',{dataUrl,timestamp:ts,context:{platform:'youtube',content_ref:'n9u8ynhBdSo',timestamp_ms:ts}});
            const r=await post('/resolve-products',{description:a.body.description??a.body,source_image:dataUrl,context:{platform:'youtube',content_ref:'n9u8ynhBdSo',timestamp_ms:ts}});
            const vm=r.body.verified_mapping||{}; const ret=vm.roster_retrieval||{};
            const ps=r.body.products||[];
            console.log(JSON.stringify({ts, roster_count:ret.roster_count??null, n:ps.length,
              rows:ps.map(p=>({c:p.result_class,id:(p.id||'').slice(0,40),host:(()=>{try{return new URL(p.destination).host}catch{return null}})(),price:p.price??null,title:(p.title||'').slice(0,50)}))},null,1));
            await new Promise(x=>setTimeout(x,2500));
          }
          JS
      - name: Stop
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/dev.pid")" 2>/dev/null || true; pkill -f workerd 2>/dev/null || true
