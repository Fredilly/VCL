name: Clef verifier replacement A/B

on:
  pull_request:
    branches: [experiment/clef-vision-vs-gemini]
    paths:
      - '.github/workflows/clef-verifier-replacement-ab.yml'
      - 'apps/api/src/clef-verification-benchmark-worker.ts'
      - 'tests/benchmark/clef-verification/replacement-from-frozen.mjs'
      - 'tests/cost/run-prepared-commerce.mjs'
  workflow_dispatch:
    inputs:
      case_limit:
        description: Number of frozen cases to run (1-8)
        required: false
        default: '8'
      candidate_limit:
        description: Max returned candidates to re-verify per case (1-8)
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: clef-verifier-replacement-ab
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CASE_LIMIT: ${{ inputs.case_limit || '8' }}
      CANDIDATE_LIMIT: ${{ inputs.candidate_limit || '5' }}

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Record commit
        run: git rev-parse HEAD | tee clef-replacement-commit.txt

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium-browser || sudo apt-get install --yes chromium

      - name: Verify branch
        run: |
          pnpm --filter @vcl/extension exec wxt prepare
          pnpm check
          pnpm build
          pnpm test

      - name: Freeze benchmark cases
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const f = JSON.parse(readFileSync('tests/manual/spike-5/cases-v2.json', 'utf8'));
          const identities = {
            's5-01': { brand: 'Patagonia', model: 'Better Sweater' },
            's5-02': { brand: 'Patagonia', model: 'Better Sweater' },
            's5-03': { brand: 'Seiko', model: 'SKX007' },
            's5-04': { brand: 'Seiko', model: 'SKX007' },
            's5-05': { brand: 'Coach', model: null },
            's5-06': { brand: 'Coach', model: null },
            's5-07': { brand: 'Adidas', model: 'Samba OG' },
            's5-08': { brand: 'Adidas', model: 'Samba OG' }
          };
          f.cases = f.cases
            .filter((c) => c.valid !== false)
            .slice(0, Number(process.env.CASE_LIMIT || 8))
            .map((c) => ({ ...c, expected_identity: identities[c.id] }));
          writeFileSync(process.env.RUNNER_TEMP + '/clef-replacement-cases.json', JSON.stringify(f));
          NODE

      - name: Prepare shared production vision once
        run: |
          export VCL_COST_CASES="$RUNNER_TEMP/clef-replacement-cases.json"
          export VCL_COST_LIMIT="$CASE_LIMIT"
          export VCL_HEADLESS=1
          export VCL_FROZEN_FRAME_DIR="$GITHUB_WORKSPACE/tests/benchmark/jev/frames"
          export VCL_PREPARE_ONLY=1
          export VCL_PREPARED_OUTPUT="$GITHUB_WORKSPACE/clef-replacement-prepared.json"
          export VCL_CDP_PORT=9334
          export VCL_COST_PROFILE="$RUNNER_TEMP/clef-replacement-browser"
          export VCL_API_ORIGIN="https://api.vcl.article6.org"
          node tests/cost/run-live.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const prepared = JSON.parse(readFileSync('clef-replacement-prepared.json', 'utf8'));
          const count = prepared.rows?.length ?? 0;
          if (!count) throw new Error('No prepared rows');
          writeFileSync('clef-replacement-count.txt', String(count));
          NODE

      - name: Freeze current production candidates and verifier baseline
        run: |
          VCL_API_ORIGIN="https://api.vcl.article6.org" \
          VCL_PREPARED_INPUT="$GITHUB_WORKSPACE/clef-replacement-prepared.json" \
          VCL_PREPARED_CASE_COUNT="$(cat clef-replacement-count.txt)" \
          VCL_COST_OUTPUT="$GITHUB_WORKSPACE/clef-replacement-baseline.json" \
          node tests/cost/run-prepared-commerce.mjs

      - name: Create isolated Clef verifier preview
        run: |
          cat > clef-verifier-wrangler.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "vcl-clef-verifier-benchmark",
            "main": "apps/api/src/clef-verification-benchmark-worker.ts",
            "compatibility_date": "2026-09-11",
            "workers_dev": true,
            "ai": { "binding": "AI" },
            "previews": {
              "ai": { "binding": "AI" }
            }
          }
          JSON
          set -euo pipefail
          output="$(pnpm dlx wrangler@4.135.0 preview --config clef-verifier-wrangler.jsonc --worker-name vcl-api --name "clef-frozen-verifier-$GITHUB_RUN_ID" --json)"
          printf '%s\n' "$output" | tee clef-replacement-preview.log
          printf '%s' "$output" | jq -er '.preview_urls[0] // .preview.urls[0]' > clef-replacement-origin.txt

      - name: Run Clef on frozen production candidates
        run: |
          VCL_CLEF_PREPARED_INPUT="$GITHUB_WORKSPACE/clef-replacement-prepared.json" \
          VCL_CLEF_BASELINE_INPUT="$GITHUB_WORKSPACE/clef-replacement-baseline.json" \
          VCL_CLEF_REPLACEMENT_OUTPUT="$GITHUB_WORKSPACE/clef-replacement-report.json" \
          CLEF_VERIFY_ORIGIN="$(cat clef-replacement-origin.txt)" \
          CLEF_VERIFY_CANDIDATE_LIMIT="$CANDIDATE_LIMIT" \
          node tests/benchmark/clef-verification/replacement-from-frozen.mjs

      - name: Print benchmark summary
        run: jq '.summary' clef-replacement-report.json

      - name: Delete isolated Clef preview
        if: always()
        continue-on-error: true
        run: |
          pnpm dlx wrangler@4.135.0 preview delete --worker-name vcl-api --name "clef-frozen-verifier-$GITHUB_RUN_ID" --skip-confirmation || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clef-verifier-replacement-ab-${{ github.run_id }}
          path: |
            clef-replacement-commit.txt
            clef-replacement-preview.log
            clef-replacement-prepared.json
            clef-replacement-baseline.json
            clef-replacement-report.json
