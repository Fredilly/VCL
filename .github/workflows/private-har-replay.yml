name: Private Scoop HAR resolver replay

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: 'Maximum paid resolver calls (1-22); start with 3'
        required: true
        default: '3'
        type: choice
        options: ['1','3','5','10','22']

permissions:
  contents: read

concurrency:
  group: private-har-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.SCOOP_REPLAY_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.SCOOP_REPLAY_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAR_SHA256: ${{ secrets.SCOOP_REPLAY_HAR_SHA256 }}
      SCOOP_READER_BASIC_AUTH: ${{ secrets.SCOOP_READER_BASIC_AUTH }}
      SCOOP_REPLAY_HAR_ENDPOINT: https://api.vcl.article6.org/resolve-products
      SCOOP_REPLAY_CONTENT_REF: n9u8ynhBdSo
      SCOOP_REPLAY_MAX_CASES: ${{ inputs.case_limit }}
      SCOOP_HAR_REPLAY_CONFIRM: 'YES'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download private HAR using bucket-scoped R2 credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m pip install --quiet boto3
          python3 - <<'PY'
          import hashlib, os, pathlib
          import boto3
          from botocore.config import Config
          required=('R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ACCOUNT_ID','HAR_SHA256')
          if any(not os.environ.get(k) for k in required):
              raise SystemExit('Missing private R2 replay credentials or checksum secret')
          expected=os.environ['HAR_SHA256'].strip().lower()
          if len(expected)!=64 or any(c not in '0123456789abcdef' for c in expected):
              raise SystemExit('Invalid HAR SHA-256')
          s3=boto3.client('s3',
            endpoint_url='https://'+os.environ['R2_ACCOUNT_ID']+'.r2.cloudflarestorage.com',
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
            region_name='auto',config=Config(signature_version='s3v4',
              connect_timeout=15,read_timeout=45,retries={'max_attempts':2}))
          body=s3.get_object(Bucket='scoop-private-replays',
            Key='network-log(20261010-081638).har')['Body']
          data=body.read(16*1024*1024+1)
          body.close()
          if len(data)>16*1024*1024:
              raise SystemExit('HAR exceeds 16 MB')
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('Private HAR SHA-256 mismatch')
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'private-scoop.har')
          out.write_bytes(data)
          out.chmod(0o600)
          print('Private HAR downloaded and checksum verified')
          PY

      - name: Replay selected Handbagholic resolver calls
        shell: bash
        run: |
          set -euo pipefail
          node tools/replay-scoop-har-resolver.mjs \
            "$RUNNER_TEMP/private-scoop.har" \
            "$RUNNER_TEMP/replay-report.json" \
            "$SCOOP_REPLAY_HAR_ENDPOINT"

      - name: Upload metadata-only replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoop-handbagholic-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Remove private HAR from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/private-scoop.har"
