name: Private Scoop HAR resolver replay

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: 'Maximum paid resolver calls (1-22); start with 3'
        required: true
        default: '3'
        type: choice
        options: ['1','3','5','10','22']

permissions:
  contents: read

concurrency:
  group: private-har-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAR_URL: ${{ secrets.SCOOP_REPLAY_HAR_URL }}
      HAR_SHA256: ${{ secrets.SCOOP_REPLAY_HAR_SHA256 }}
      SCOOP_READER_BASIC_AUTH: ${{ secrets.SCOOP_READER_BASIC_AUTH }}
      SCOOP_REPLAY_HAR_ENDPOINT: https://api.vcl.article6.org/resolve-products
      SCOOP_REPLAY_CONTENT_REF: n9u8ynhBdSo
      SCOOP_REPLAY_MAX_CASES: ${{ inputs.case_limit }}
      SCOOP_HAR_REPLAY_CONFIRM: 'YES'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safely download private HAR without printing URL or contents
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request
          url=os.environ.get('HAR_URL','')
          expected=os.environ.get('HAR_SHA256','').lower()
          if not url or not expected:
              raise SystemExit('Missing SCOOP_REPLAY_HAR_URL or SCOOP_REPLAY_HAR_SHA256 repository secret')
          parsed=urllib.parse.urlparse(url)
          if parsed.scheme!='https' or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit('Replay HAR URL must be HTTPS with no embedded credentials')
          if len(expected)!=64 or any(c not in '0123456789abcdef' for c in expected):
              raise SystemExit('Invalid HAR SHA256 repository secret')
          req=urllib.request.Request(url,headers={'User-Agent':'ScoopPrivateReplay/1'})
          with urllib.request.urlopen(req,timeout=45) as response:
              if response.geturl()!=url:
                  raise SystemExit('HAR redirects are not permitted')
              data=response.read(16*1024*1024+1)
          if len(data)>16*1024*1024:
              raise SystemExit('HAR exceeds 16 MB limit')
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('Private HAR SHA256 mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'],'private-scoop.har').write_bytes(data)
          print('Private HAR downloaded and hash verified')
          PY

      - name: Replay selected Handbagholic resolver calls
        shell: bash
        run: |
          set -euo pipefail
          node tools/replay-scoop-har-resolver.mjs \
            "$RUNNER_TEMP/private-scoop.har" \
            "$RUNNER_TEMP/replay-report.json" \
            "$SCOOP_REPLAY_HAR_ENDPOINT"

      - name: Upload metadata-only replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoop-handbagholic-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/replay-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Remove private HAR from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/private-scoop.har"
